apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: markfeher/pingpong:1.0
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080

